[package]
name = "graf"
version = "0.5.0"
edition = "2024"
description = "CLI and MCP server for a markdown knowledge base and todo system"
license = "Apache-2.0"
repository = "https://github.com/rnortman/graf"
readme = "README.md"
keywords = ["markdown", "knowledge-base", "todo", "mcp", "notes"]
categories = ["command-line-utilities", "text-processing"]
default-run = "graf"

exclude = [
    ".claude/",
    ".githooks/",
    ".github/",
    ".gitleaks.toml",
    "CLAUDE.md",
    "Makefile",
    "TODO.md",
]

[dependencies]
anyhow = "1.0.102"
brenn-mcp = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive"] }
iana-time-zone = "0.1.65"
ordered-float = "5.3.0"
rrule = "0.14.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.149"
toml = "1.1.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
